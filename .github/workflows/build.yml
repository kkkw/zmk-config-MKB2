name: Build ZMK firmware

on:
  push:
    paths:
      - "config/**"
      - "boards/**"
      - "snippets/**"
      - "build.yaml"
      - "zephyr/module.yml"
      - ".github/workflows/build.yml"

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: te9no/zmk-workspace/.github/workflows/build-zmk-firmware.yml@main
    permissions:
      contents: write
      actions: read
    with:
      target: "MKB_L_MODULE_ENC|MKB_R_MODULE_TBv4"
      commit_firmware: true
      fail_on_no_targets: true
      build_yaml: "build.yaml"
      firmware_folder: "firmware"
      max_parallel: 4

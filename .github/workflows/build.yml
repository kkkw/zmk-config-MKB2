name: Build ZMK firmware

on:
  push:
    paths:
      - "config/**"
      - "boards/**"
      - "snippets/**"
      - "build.yaml"
      - "zephyr/module.yml"
      - ".github/workflows/build.yml"

permissions:
  contents: write
  actions: read

jobs:
  build:
    # The provenance step added after 7e05681 expects .git inside the build
    # container, but actions/checkout does not expose it in this reusable job.
    uses: te9no/zmk-workspace/.github/workflows/build-zmk-firmware.yml@7e0568148904fe229d17f0c145e86d17a1b6d3b5
    permissions:
      contents: write
      actions: read
    with:
      target: "MKB_L_MODULE_ENC|MKB_L_MODULE_JOY|MKB_R_MODULE_TBv4"
      commit_firmware: true
      fail_on_no_targets: true
      build_yaml: "build.yaml"
      firmware_folder: "firmware"
      max_parallel: 4
